<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="35%" stop-color="#121a2c"/>
      <stop offset="70%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#080b13"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="12" y1="8" x2="52" y2="40">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- badge -->
  <circle cx="32" cy="32" r="30" fill="url(#badge)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#26314d" stroke-width="1.5"/>

  <!-- ambient glow behind the glyph, echoing the app's own timer glow -->
  <circle cx="32" cy="30" r="20" fill="url(#glow)" filter="url(#blur)"/>

  <!-- power ring with a gap at top, standing in for both "power" and
       the app's circular countdown - one continuous progress arc -->
  <path d="M 42.32 17.25 A 18 18 0 1 1 21.68 17.25"
        fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"/>

  <!-- power line, entering the ring through the gap -->
  <line x1="32" y1="6" x2="32" y2="30" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"/>

  <!-- small bright dot at the ring's leading edge - a countdown "cursor" -->
  <circle cx="21.68" cy="17.25" r="2.6" fill="#22d3ee"/>
</svg>
