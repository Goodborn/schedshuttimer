[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shutdown-timer"
version = "1.0.0"
description = "A heavily animated shutdown timer for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "dbus-python>=1.3",
]

[project.scripts]
shutdown-timer = "shutdown_timer.__main__:main"

[project.urls]
Homepage = "https://github.com/goodborn/ShutdownTimer"
