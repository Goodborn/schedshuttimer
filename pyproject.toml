[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shutdown-timer"
version = "1.0.0"
description = "A heavily animated shutdown timer for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
]

[project.optional-dependencies]
# Not required: shutdown.py falls back to `systemctl poweroff` when this
# isn't importable. dbus-python is a C extension with no reliable prebuilt
# wheel on most platforms, so it's opt-in rather than a hard dependency.
dbus = ["dbus-python>=1.3"]

[project.scripts]
shutdown-timer = "shutdown_timer.__main__:main"

[project.urls]
Homepage = "https://github.com/goodborn/ShutdownTimer"
